repositories:
  - name: argo-helm
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argocd
    namespace: argocd
    chart: argo-helm/argo-cd
    version: 9.7.0
    atomic: true
    values:
      - ../charts/argocd/values.yaml.gotmpl

environments:
    {{.Environment.Name}}:
      values:
        - ../charts/argocd/values.yaml
